# 合同管理系统配置文件
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: contract-management
  
  # 数据库配置 - 使用H2内存数据库进行开发测试
  datasource:
    url: jdbc:h2:mem:contract_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
    
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      
  # 邮件配置
  mail:
    host: smtp.company.com
    port: 587
    username: system@company.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
# JWT配置
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000 # 24小时
  
# 文件存储配置
file:
  upload-path: ./uploads/
  
# 日志配置
logging:
  level:
    com.company.contract: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"